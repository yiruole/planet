<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Art — Ruole Yi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .vid-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:2px;
      background:var(--faint);
    }
    .vid-item {
      background:#fff; overflow:hidden;
    }
    .vid-item video {
      width:100%; display:block;
      max-height:580px; object-fit:cover;
      background:#f0efed;
    }
    .yt-wrap {
      position:relative;
      aspect-ratio:9/16;
      max-height:580px;
      background:#f0efed;
      overflow:hidden;
    }
    .yt-wrap iframe {
      position:absolute;
      inset:0; width:100%; height:100%;
      border:0;
    }
    .vid-info {
      padding:24px 32px 36px;
    }
    .vid-num {
      font-size:.6rem; letter-spacing:.3em;
      text-transform:uppercase; color:var(--muted); margin-bottom:12px;
    }
    .vid-title {
      font-family:var(--font-d);
      font-size:clamp(1.4rem,2.5vw,2.2rem);
      font-weight:300; font-style:italic; margin-bottom:8px;
    }
    .vid-meta {
      font-size:.65rem; letter-spacing:.2em;
      text-transform:uppercase; color:var(--muted);
    }
    @media (max-width:768px) {
      .vid-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<nav id="nav">
  <a href="index.html" class="nav-logo">Ruole Yi</a>
  <ul class="nav-links">
    <li><a href="oil-painting.html">Oil Painting</a></li>
    <li><a href="digital-art.html" class="active">Digital Art</a></li>
    <li><a href="experimental-film.html">Experimental Film</a></li>
    <li><a href="photography.html">Photography</a></li>
    <li><a href="music.html">Music</a></li>
  </ul>
  <button class="burger" id="burger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="m-nav" id="mnav">
  <a href="oil-painting.html" data-close>Oil Painting</a>
  <a href="digital-art.html" data-close>Digital Art</a>
  <a href="experimental-film.html" data-close>Experimental Film</a>
  <a href="photography.html" data-close>Photography</a>
  <a href="music.html" data-close>Music</a>
</div>

<div class="page-header">
  <div class="page-header-inner">
    <span class="pg-sup rv">Work 02</span>
    <h1 class="pg-title rv d1">Digital<br>Art</h1>
    <span class="pg-sub rv d2">2 works</span>
  </div>
</div>

<div class="vid-grid rv">
  <div class="vid-item">
    <div class="yt-wrap">
      <iframe src="https://www.youtube.com/embed/08PH2weAcpI" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="vid-info">
      <div class="vid-num">01 / 02</div>
      <h2 class="vid-title">Work I</h2>
      <div class="vid-meta">Digital art</div>
    </div>
  </div>
  <div class="vid-item">
    <video src="数字艺术/111.MOV" muted autoplay loop playsinline preload="metadata"></video>
    <div class="vid-info">
      <div class="vid-num">02 / 02</div>
      <h2 class="vid-title">Work II</h2>
      <div class="vid-meta">Digital art</div>
    </div>
  </div>
</div>

<footer>
  <span class="ft-left">&copy; 2026 Ruole Yi</span>
  <div class="ft-right">
    <a href="mailto:yiruole@outlook.com">Email</a>
    <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
  </div>
</footer>

<script>
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('stuck', window.scrollY > 50);
}, {passive:true});

const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('on'); });
}, {threshold:.08, rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.rv').forEach(el => obs.observe(el));

const burger = document.getElementById('burger');
const mnav = document.getElementById('mnav');
burger.addEventListener('click', () => {
  const open = burger.classList.toggle('open');
  mnav.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
});
mnav.querySelectorAll('[data-close]').forEach(a => {
  a.addEventListener('click', () => {
    burger.classList.remove('open');
    mnav.classList.remove('open');
    document.body.style.overflow = '';
  });
});
</script>
</body>
</html>
